name: Vérifications

# Couvre toutes les branches et toutes les pull requests, branche par défaut
# comprise.
#
# Plus aucun workflow GitHub ne se déclenche automatiquement sur la branche par
# défaut depuis que Cloudflare Workers Builds assure la publication. Sans ce
# job, un commit cassé n'afficherait aucun signal sur GitHub et il faudrait
# aller lire les journaux de build côté Cloudflare pour s'en apercevoir.
on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build
