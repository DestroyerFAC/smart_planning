name: Vérifications

# Couvre les pull requests et les branches de travail. La branche par défaut
# est déjà vérifiée par le workflow de déploiement, qui lance les mêmes
# contrôles avant de publier : on l'exclut ici pour ne pas tout faire deux fois.
on:
  pull_request:
  push:

jobs:
  verify:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build
